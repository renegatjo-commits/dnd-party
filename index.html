
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>D&D Party Map</title>
<style>
:root{--bg:#15130f;--panel:#211e18;--panel2:#2b271f;--line:#554b39;--gold:#d7b56d;--text:#f4ead5;--muted:#aaa08e;--danger:#bd5d57;--cell:64px}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#30291d,#12110e 55%);color:var(--text);font:14px Georgia,serif;min-height:100vh}
button,input,textarea{font:inherit}.app{max-width:1500px;margin:auto;padding:18px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:22px;letter-spacing:.12em;margin:0;color:var(--gold)}.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{border:1px solid var(--line);background:#29241c;color:var(--text);padding:9px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--gold)}button.active{background:#69562f;border-color:#d9bd79}.master{display:none}.is-master .master{display:inline-block}
.status{font:12px Arial;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px 12px;overflow:visible;padding:5px 2px 34px}
.card{position:relative;min-width:0;background:linear-gradient(145deg,#2a261f,#1d1a15);border:1px solid #554b39;border-radius:12px;padding:10px 10px 34px;box-shadow:0 8px 24px #0005}.card.npc{background:linear-gradient(145deg,#352326,#201719);border-color:#784d53}.card.npc .avatar{border-color:#bd777f}.cardOrder{position:absolute;right:8px;top:8px;display:flex;gap:4px}.cardOrder button{padding:3px 6px;font-size:11px}
.cardHead{display:flex;gap:12px;align-items:flex-start}.avatarWrap{position:relative;flex:0 0 70px;width:70px;padding-bottom:13px}.avatar{display:block;width:68px;height:68px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#111}.hpBadge{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;min-width:64px;height:25px;box-sizing:border-box;padding:3px 8px;border:1px solid #443d31;border-radius:16px;background:#15130f;color:#e9a09a;font:11px Arial;white-space:nowrap;z-index:2}
.card h3{margin:2px 0 4px;font-size:17px}.role{color:#bfb39d;font-style:italic;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;width:100%;margin:8px 0 11px;align-items:end}.statBox{display:flex;flex-direction:column;gap:3px;min-width:0;width:100%;overflow:hidden}.statLabel{display:block;width:100%;padding:0;color:#8f8a80;font:8px Arial;text-align:center;line-height:1}.pill{display:flex;align-items:center;justify-content:center;width:100%;min-width:0;min-height:30px;box-sizing:border-box;background:#15130f;border:1px solid #443d31;border-radius:20px;padding:5px 4px;font:clamp(9px,1.8vw,12px) Arial;text-align:center;white-space:nowrap;overflow:hidden}.hp{color:#e9a09a}
.items{font:12px Arial;line-height:1.45;color:#d8cfbd;min-height:34px}.charBadges{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);display:flex;justify-content:center;align-items:center;gap:6px;z-index:6}.charBadge{width:52px;height:52px;object-fit:contain;border:0;border-radius:50%;background:transparent;padding:0;filter:drop-shadow(0 3px 4px #0008)}.editChar{position:absolute;right:8px;bottom:8px;padding:4px 7px;font-size:11px;z-index:7}
.boardPanel{border:1px solid var(--line);background:#1c1914;border-radius:14px;overflow:hidden}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;border-bottom:1px solid #40392e;background:#252119}
.toolbar .sep{width:1px;height:26px;background:#51493b}.toolbar label{font:12px Arial;color:#c7bdab}.toolbar input[type=range]{width:110px}
.viewport{position:relative;width:100%;height:min(70vh,850px);overflow:auto;background:#0b0a08;touch-action:none;cursor:grab}.viewport.panning{cursor:grabbing}
.stage{position:relative;transform-origin:0 0;min-width:800px;min-height:600px;background:#17140f}
.map{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;pointer-events:none}
.grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,#fff4 1px,transparent 1px),linear-gradient(to bottom,#fff4 1px,transparent 1px);background-size:var(--cell) var(--cell)}
.token{position:absolute;width:52px;height:52px;border-radius:50%;border:3px solid #f1d28b;background:#28231b center/cover no-repeat;box-shadow:0 3px 12px #000;transform:translate(-50%,-50%);cursor:grab;z-index:5;touch-action:none}
.token.selected{outline:3px solid #fff8;outline-offset:3px}.token span{position:absolute;left:50%;top:100%;transform:translate(-50%,5px);white-space:nowrap;background:#111d;padding:3px 6px;border-radius:5px;font:11px Arial;color:white;pointer-events:none}
.overlay{position:absolute;transform:translate(-50%,-50%);z-index:4;user-select:none}.overlay img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}.overlay.masterMove{cursor:grab;touch-action:none}.rotateHandle{position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:28px;height:28px;padding:0;border-radius:50%;background:#211e18;border:1px solid #d7b56d;color:#f4ead5;cursor:grab;z-index:8}.overlayLabel{position:absolute;left:50%;top:100%;transform:translate(-50%,4px);white-space:nowrap;background:#111d;color:#fff;padding:2px 5px;border-radius:4px;font:10px Arial;pointer-events:none}.range{position:absolute;z-index:4;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;display:none;z-index:2}.range.speed{background:#7fcf8a25;border:2px solid #91dc9caa}.range.cast{background:#6fa7ff26;border:2px solid #84b3ff99}.range.aoe{background:#e6a84b38;border:2px solid #ffc66a;z-index:3}
.empty{padding:20px;color:var(--muted)}
dialog{border:1px solid #65583f;border-radius:13px;background:#211e18;color:var(--text);width:min(520px,94vw);box-shadow:0 20px 60px #000b}
dialog::backdrop{background:#000a}.form{display:grid;gap:10px}.form label{display:grid;gap:4px;font:12px Arial;color:#c8beac}.form input,.form textarea{width:100%;background:#12110e;color:#eee;border:1px solid #504737;border-radius:7px;padding:9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dlgActions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.danger{border-color:#7b423e;color:#f1aaa4}
.hint{padding:8px 12px;font:11px Arial;color:#9f9686;border-top:1px solid #342f27}
@media(max-width:650px){.app{padding:10px}.top{align-items:flex-start;flex-direction:column}.card{flex-basis:215px}.viewport{height:65vh}.toolbar{gap:6px}.toolbar button{padding:7px 8px;font-size:12px}}

@media(max-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:9px 9px 32px}.avatarWrap{flex-basis:52px;width:52px;padding-bottom:11px}.avatar{width:50px;height:50px}.hpBadge{min-width:54px;height:22px;font-size:10px;padding:2px 6px}.card h3{font-size:15px}}
@media(max-width:430px){.cards{grid-template-columns:1fr}}

.token.npcArt{width:auto;height:auto;min-width:52px;min-height:52px;border:0;border-radius:0;background:transparent!important;box-shadow:none}
.token.npcArt img{display:block;max-width:110px;max-height:110px;object-fit:contain;pointer-events:none;filter:drop-shadow(0 4px 5px #0009)}
.spellAim{position:absolute;display:none;z-index:auto;pointer-events:none}.aimRotator{position:absolute;left:0;top:0;height:34px;transform-origin:0 50%;pointer-events:none;z-index:3}
.spellBeam{position:absolute;width:34px;height:var(--beam-length);left:calc(var(--beam-length)/2 - 17px);top:calc(17px - var(--beam-length)/2);transform:rotate(90deg);transform-origin:center center;object-fit:fill;opacity:.95;filter:drop-shadow(0 0 5px #8e55ff);pointer-events:none}
.aimArrow{position:absolute;right:-9px;top:50%;transform:translateY(-50%);font:25px Arial;color:#cda9ff;text-shadow:0 0 7px #6e32d9}
.aimHandle{position:absolute;z-index:36;left:0;top:0;transform:translate(-50%,-50%);width:30px;height:30px;padding:0;border-radius:50%;background:#2d203b;border:1px solid #c49cff;color:#fff;pointer-events:auto;touch-action:none;cursor:grab}
.spellControls{position:absolute;z-index:35;left:20px;top:34px;display:flex;align-items:center;gap:5px;white-space:nowrap;pointer-events:auto}
.spellSlot{min-width:28px;padding:5px 7px}.spellSlot.active{border-color:#c49cff;box-shadow:0 0 0 1px #c49cff inset;background:#30213e}
#aimDistance{font:11px Arial;color:#c8c0b5;background:#15130f;border:1px solid #443d31;border-radius:12px;padding:5px 7px}
.publishSpell{position:static;white-space:nowrap;padding:6px 9px;background:#26331f;border-color:#79975e;pointer-events:auto}.deleteSpell{white-space:nowrap;padding:6px 9px;background:#3a2020;border-color:#8d5555;color:#f0c7c7;pointer-events:auto}
.sharedSpell{position:absolute;z-index:3;pointer-events:auto;cursor:pointer}.sharedSpellLine{position:absolute;left:0;top:0;height:34px;transform-origin:0 50%;pointer-events:auto}
.sharedSpellLine img{position:absolute;width:34px;height:var(--beam-length);left:calc(var(--beam-length)/2 - 17px);top:calc(17px - var(--beam-length)/2);transform:rotate(90deg);transform-origin:center center;object-fit:fill;filter:drop-shadow(0 0 5px #8e55ff);pointer-events:none}
.sharedSpellLine span{position:absolute;right:-8px;top:50%;transform:translateY(-50%);font:23px Arial;color:#cda9ff;text-shadow:0 0 7px #6e32d9}

.areaAim{position:absolute;display:none;z-index:auto;pointer-events:none}
.areaAim img{position:relative;z-index:3;display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 0 7px #9c58ff)}.sharedArea img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 0 7px #9c58ff)}
.areaControls{position:absolute;z-index:35;left:50%;top:calc(100% + 8px);transform:translateX(-50%);display:flex;gap:5px;white-space:nowrap;pointer-events:auto}
.areaControls select,.areaControls button{font-size:11px;padding:5px 7px}
#deleteArea{background:#3a2020;border-color:#8d5555;color:#f0c7c7}
.sharedArea{position:absolute;z-index:3;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer}

.spellMenu{position:absolute;display:none;z-index:40;background:#1c1914;border:1px solid #62563f;border-radius:10px;padding:8px;box-shadow:0 8px 22px #0009}
.spellMenuTitle{font:11px Arial;color:#a99f8e;margin:0 0 6px}.menuSlots,.spellMenuRow,.areaKinds{display:flex;gap:5px}.menuSlots{margin-bottom:6px}.menuSlots button{min-width:34px}.menuSlots button.active{border-color:#c49cff;background:#30213e}.areaKinds{display:none;margin-top:6px}
.spellMenu button{font-size:12px;padding:6px 9px}.spellMenu button.active{border-color:#c49cff;background:#30213e}
</style>
</head>
<body>
<div class="app" id="app">
 <div class="top">
  <div><h1>D&D PARTY</h1><div class="status" id="status">Подключение…</div></div>
  <div class="actions">
   <button id="masterLogin">Войти как мастер</button>
   <button id="logout" style="display:none">Выйти</button>
   <button class="master" id="addChar">+ Персонаж</button>
   <button class="master" id="addOverlay">+ PNG на карту</button>
   <button class="master" id="mapSettings">Настройки карты</button>
  </div>
 </div>
 <section class="cards" id="cards"><div class="empty">Персонажи пока не добавлены.</div></section>
 <section class="boardPanel">
  <div class="toolbar">
   <button id="speedBtn">Скорость</button>
   <button id="castBtn">Заклинания</button>
   
   <span class="sep"></span>
   <label>Масштаб <input id="zoom" type="range" min="50" max="180" value="100"> <span id="zoomVal">100%</span></label>
  </div>
  <div class="viewport" id="viewport">
   <div class="stage" id="stage">
    <img class="map" id="map" alt="">
    <div class="grid"></div>
    <div class="range speed" id="speedRange"></div>
    <div class="range cast" id="castRange"></div>
    <div class="range aoe" id="aoeRange"></div>
    <div id="sharedAreas"></div>
    <div id="sharedSpells"></div>
    <div class="spellMenu" id="spellMenu">
      <div class="spellMenuTitle">Заклинание <span id="menuSlotTitle">I</span></div>
      <div class="menuSlots"><button id="menuSlot1">I</button><button id="menuSlot2">II</button></div>
      <div class="spellMenuRow"><button id="chooseDirected">Направленное</button><button id="chooseArea">Площадное</button></div>
      <div class="areaKinds" id="areaKinds"><button id="chooseShield">Щит</button><button id="chooseAttackArea">Атакующее</button></div>
    </div>
    <div class="spellAim" id="spellAim">
      <div class="aimRotator" id="aimRotator">
        <img class="spellBeam" src="https://forgottenadventures.piwigo.com/_datas/w/s/l/wslrhsw6z4/i/uploads/w/s/l/wslrhsw6z4//2022/06/12/20220612092337-f8d252df-me.png" alt="">
        <span class="aimArrow">➤</span>
      </div>
      <button class="aimHandle" id="aimHandle" title="Тянуть: направление и дальность">●</button>
      <div class="spellControls" id="spellControls">
        <button class="spellSlot active" id="spellSlot1">I</button>
        <button class="spellSlot" id="spellSlot2">II</button>
        <span id="aimDistance">0 кл.</span>
        <button class="publishSpell" id="publishSpell">✓ Опубликовать</button>
        <button class="deleteSpell" id="deleteSpell">✕ Удалить</button>
        <button class="deleteSpell" id="deleteAllSpells">✕ Все</button>
      </div>
    </div>
    <div class="areaAim" id="areaAim">
      <img id="areaAimImg" alt="">
      <div class="areaControls">
        <button id="publishArea">✓ Опубликовать</button>
        <button id="deleteArea">✕ Удалить</button>
      </div>
    </div>
    <div id="overlays"></div>
    <div id="tokens"></div>
   </div>
  </div>
  <div class="hint">Выберите фишку кликом. Любой игрок может передвигать фишки. Карточки, персонажей и карту меняет только мастер.</div>
 </section>
</div>

<dialog id="loginDlg"><form class="form" id="loginForm">
 <h2>Вход мастера</h2>
 <label>Email<input id="email" type="email" required></label>
 <label>Пароль<input id="password" type="password" required></label>
 <div class="status" id="loginError" style="color:#f0a39b;line-height:1.4"></div>
 <div class="dlgActions"><button type="button" data-close>Отмена</button><button type="submit">Войти</button></div>
</form></dialog>

<dialog id="charDlg"><form class="form" id="charForm">
 <h2 id="charTitle">Персонаж</h2><input id="charId" type="hidden">
 <label>Имя<input id="cName" required></label>
 <label>Должность / роль<input id="cRole"></label>
 <label>Ссылка на аватар<input id="cAvatar" placeholder="https://..."></label>
 <div class="row"><label>HP<input id="cHp" type="number" value="10"></label><label>Макс. HP<input id="cMaxHp" type="number" value="10"></label></div>
 <div class="row"><label>Бонус<input id="cBonus" placeholder="+2"></label><label>Скорость, клеток<input id="cSpeed" type="number" min="0" step="1" placeholder="6"></label></div>
 <div class="row"><label>Дальность заклинания, клеток<input id="cSpellRange" type="number" min="0" step="1" placeholder="10"></label><label>Площадь, клеток<input id="cArea" type="number" min="0" step="1" placeholder="3"></label></div>
 <label style="display:flex;grid-template-columns:auto 1fr;align-items:center;gap:8px"><input id="cNpc" type="checkbox" style="width:auto"> NPC — фишку может двигать только мастер</label>
 <label>PNG NPC на карте <span class="status">(необязательно; будет виден всем вместо круглой фишки)</span><input id="cNpcPng" placeholder="https://...png"></label>
 <label>Предметы<textarea id="cItems" rows="3" placeholder="Палочка, зелье, кинжал…"></textarea></label>
 <label>Значки <span class="status">(ссылки на PNG/JPG, по одной в строке)</span><textarea id="cBadges" rows="3" placeholder="https://.../badge1.png&#10;https://.../badge2.png"></textarea></label>
 <div class="dlgActions"><button type="button" class="danger" id="deleteChar">Удалить</button><button type="button" data-close>Отмена</button><button type="submit">Сохранить</button></div>
</form></dialog>


<dialog id="overlayDlg"><form class="form" id="overlayForm">
 <h2>PNG на карту</h2><input id="overlayId" type="hidden">
 <label>Название<input id="oName" placeholder="Например: сундук"></label>
 <label>Ссылка на PNG<input id="oUrl" required placeholder="https://...png"></label>
 <label>Размер, px <span class="status">(по ширине, пропорции PNG сохраняются автоматически)</span><input id="oWidth" type="number" min="10" value="120"></label>
 <div class="dlgActions"><button type="button" class="danger" id="deleteOverlay">Удалить</button><button type="button" data-close>Отмена</button><button type="submit">Сохранить</button></div>
</form></dialog>

<dialog id="mapDlg"><form class="form" id="mapForm">
 <h2>Настройки карты</h2>
 <label>Ссылка на изображение карты<input id="mapUrl" placeholder="https://..."></label>
 <div class="row"><label>Ширина карты, px<input id="mapWidth" type="number" min="300" value="1280"></label><label>Высота карты, px<input id="mapHeight" type="number" min="300" value="800"></label></div>
 <label>Размер клетки, px<input id="cellSize" type="number" min="20" max="200" value="64"></label>
 <div class="dlgActions"><button type="button" data-close>Отмена</button><button type="submit">Сохранить</button></div>
</form></dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, signInAnonymously, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyDbMYr99XAJWtpVBzU2WBgham-o_RykEK8",
 authDomain: "dnd-party-d2291.firebaseapp.com",
 projectId: "dnd-party-d2291",
 storageBucket: "dnd-party-d2291.firebasestorage.app",
 messagingSenderId: "272197003899",
 appId: "1:272197003899:web:8a524f19176aad729b90de"
};
const MASTER_UID="j38gO3G1YlRgnG7Jg3gycK8QeoE3";
const fb=initializeApp(firebaseConfig), auth=getAuth(fb), db=getFirestore(fb);
const $=s=>document.querySelector(s);
let chars=new Map(), tokenData=new Map(), overlayData=new Map(), spellData=new Map(), selected=null, activeSpellSlot=1, activeSpellMode="directed", areaKind="shield", aimState={1:{angle:0,range:null},2:{angle:0,range:null}}, settings={mapUrl:"",mapWidth:1280,mapHeight:800,cellSize:64};
let liveUnsubs=[];

function isMaster(){return auth.currentUser?.uid===MASTER_UID}
function applyRole(){
 document.body.classList.toggle("is-master",isMaster());
 $("#logout").style.display=isMaster()?"inline-block":"none";
 $("#masterLogin").style.display=isMaster()?"none":"inline-block";
 $("#status").textContent=isMaster()?"Режим мастера · синхронизация включена":"Игрок · синхронизация включена";
}
async function ensureAnonymous(){
 if(auth.currentUser) return;
 try{
   await signInAnonymously(auth);
 }catch(err){
   console.error("Anonymous auth failed:",err);
   $("#status").textContent="Ошибка подключения: "+(err.code||err.message);
 }
}

function stopListeners(){
 liveUnsubs.forEach(fn=>{try{fn()}catch(e){}});
 liveUnsubs=[];
}

onAuthStateChanged(auth, async u=>{
 stopListeners();
 if(!u){
   $("#status").textContent="Подключение…";
   await ensureAnonymous();
   return;
 }
 applyRole();
 startListeners();
});

function listenError(err){
 console.error("Firestore listener:",err);
 $("#status").textContent=(isMaster()?"Мастер":"Игрок")+" · ошибка доступа к базе";
}

function startListeners(){
 liveUnsubs.push(onSnapshot(collection(db,"characters"),snap=>{
   chars.clear(); snap.forEach(d=>chars.set(d.id,{id:d.id,...d.data()}));
   renderCards(); renderTokens();
 },listenError));
 liveUnsubs.push(onSnapshot(collection(db,"tokens"),snap=>{
   tokenData.clear(); snap.forEach(d=>tokenData.set(d.id,{id:d.id,...d.data()}));
   renderTokens();renderSharedSpells();
 },listenError));
 liveUnsubs.push(onSnapshot(doc(db,"game","main"),d=>{
   if(d.exists())settings={...settings,...d.data()};
   applyMap();
 },listenError));
 liveUnsubs.push(onSnapshot(collection(db,"overlays"),snap=>{
   overlayData.clear(); snap.forEach(d=>overlayData.set(d.id,{id:d.id,...d.data()}));
   renderOverlays();
 },listenError));
 liveUnsubs.push(onSnapshot(collection(db,"spells"),snap=>{
   spellData.clear(); snap.forEach(d=>spellData.set(d.id,{id:d.id,...d.data()}));
   renderSharedSpells();
   if(selected)refreshOpenSpellEditor()
 },listenError));
}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function renderCards(){
 const box=$("#cards"); if(!chars.size){box.innerHTML='<div class="empty">Персонажи пока не добавлены.</div>';return}
 const list=[...chars.values()].sort((a,b)=>(a.order??9999)-(b.order??9999)||String(a.name).localeCompare(String(b.name)));
 box.innerHTML=list.map((c,i)=>`<article class="card ${c.isNpc?"npc":""}">
  ${isMaster()?`<div class="cardOrder"><button title="Сдвинуть влево" data-left="${c.id}" ${i===0?"disabled":""}>←</button><button title="Сдвинуть вправо" data-right="${c.id}" ${i===list.length-1?"disabled":""}>→</button></div>`:""}

async function moveCard(id,dir){
 if(!isMaster())return;
 const list=[...chars.values()].sort((a,b)=>(a.order??9999)-(b.order??9999)||String(a.name).localeCompare(String(b.name)));
 const i=list.findIndex(c=>c.id===id), j=i+dir; if(i<0||j<0||j>=list.length)return;
 // Normalize all positions so old characters without order also work.
 const batch=list.map((c,k)=>({id:c.id,order:k}));
 const tmp=batch[i].order; batch[i].order=batch[j].order; batch[j].order=tmp;
 await Promise.all(batch.map(x=>updateDoc(doc(db,"characters",x.id),{order:x.order})));
}

 } positionRanges();

function overlayRotateStart(e){
 if(!isMaster())return;
 e.preventDefault();e.stopPropagation();
 const handle=e.currentTarget,el=handle.closest(".overlay"),id=el.dataset.id;
 const o=overlayData.get(id)||{};
 const stageRect=$("#stage").getBoundingClientRect(),z=+$("#zoom").value/100;
 const cx=stageRect.left+(o.x??150)*z,cy=stageRect.top+(o.y??150)*z;
 handle.setPointerCapture(e.pointerId);
 const move=ev=>{
   const deg=Math.atan2(ev.clientY-cy,ev.clientX-cx)*180/Math.PI+90;
   const normalized=((deg+180)%360+360)%360-180;
   el.style.transform=`translate(-50%,-50%) rotate(${normalized}deg)`;
   el.dataset.rotation=normalized;
 };
 const up=async()=>{
   handle.removeEventListener("pointermove",move);handle.removeEventListener("pointerup",up);
   const rotation=parseFloat(el.dataset.rotation??o.rotation??0);
   await updateDoc(doc(db,"overlays",id),{rotation});
 };
 handle.addEventListener("pointermove",move);handle.addEventListener("pointerup",up);
}

 const up=async()=>{el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",up);await updateDoc(doc(db,"overlays",id),{x:parseFloat(el.style.left),y:parseFloat(el.style.top)})};
 el.addEventListener("pointermove",move);el.addEventListener("pointerup",up);
}

 };

 el.addEventListener("pointermove",move);el.addEventListener("pointerup",up);
}
function positionRanges(x,y){

function speedCells(){

function spellRangeCells(){const c=chars.get(selected);return c?Math.max(0,Number(c.spellRange)||0):0}
function areaCells(){const c=chars.get(selected);return c?Math.max(0,Number(c.area)||0):0}
function spellDocId(slot=activeSpellSlot,id=selected){return id?`${id}_${slot}`:""}
function slotDoc(slot=activeSpellSlot){return spellData.get(spellDocId(slot))}
function spellType(s){return s?.type==="area"?"area":"directed"}

function currentAim(){
 const max=spellRangeCells(),s=aimState[activeSpellSlot];
 if(s.range==null||s.range>max)s.range=max;
 return s;
}
function loadAimForSlot(){
 const d=slotDoc(),max=spellRangeCells();
 if(d && Number.isFinite(Number(d.angle)) && Number.isFinite(Number(d.range))){
   aimState[activeSpellSlot]={angle:Number(d.angle)||0,range:Math.min(max,Number(d.range)||max)};
 }else{
   aimState[activeSpellSlot]={angle:0,range:max};
 }
}

function attackPoint(id=selected,slot=activeSpellSlot,docData=null){
 const tk=tokenData.get(id);if(!tk)return null;
 let angle,range;
 if(docData){
   angle=Number(docData.angle);range=Number(docData.range);
 }else{
   const s=aimState[slot];angle=Number(s?.angle);range=Number(s?.range);
 }
 if(!Number.isFinite(angle)||!Number.isFinite(range))return null;
 const a=angle*Math.PI/180,len=range*settings.cellSize;
 return {x:(tk.x??0)+Math.cos(a)*len,y:(tk.y??0)+Math.sin(a)*len};
}
function syncAreaAim(){

   const tk=tokenData.get(selected);if(!tk)return;p={x:tk.x??0,y:tk.y??0};
 }else{
   p=attackPoint();
   if(!p){$("#areaAim").style.display="none";return}
 }
 const el=$("#areaAim");
 el.style.left=(p.x-radius)+"px";el.style.top=(p.y-radius)+"px";

     el.className="sharedArea";el.style.left=p.x+"px";el.style.top=p.y+"px";
     el.style.width=(radius*2)+"px";el.style.height=(radius*2)+"px";
     el.innerHTML=`<img src="${esc(s.areaImageUrl||(s.kind==="attack"?"https://forgottenadventures.piwigo.com/uploads/w/s/l/wslrhsw6z4//2022/05/13/20220513143959-c33cdc5e.png":"https://forgottenadventures.piwigo.com/uploads/w/s/l/wslrhsw6z4//2021/06/23/20210623122729-ffa98e90.png"))}">`;
     el.onclick=e=>{e.preventDefault();e.stopPropagation();selected=s.tokenId;activeSpellSlot=Number(s.slot)||1;renderTokens();positionRanges();if(ch.isNpc&&!isMaster())return;activeSpellMode="area";areaKind=s.kind||"shield";if(areaKind==="attack")loadAimForSlot();areaKind==="attack"?showAttackAreaEditor(false):showShieldEditor()};
     box.appendChild(el);
   }
 }
}

$("#aimHandle").addEventListener("pointerdown",e=>{
 e.preventDefault();e.stopPropagation();if(!selected||!canEditSelectedSpell())return;
 const h=e.currentTarget;h.setPointerCapture(e.pointerId);
 let lastWrite=0;
 const move=ev=>{
   const tk=tokenData.get(selected),r=$("#stage").getBoundingClientRect(),z=+$("#zoom").value/100;if(!tk)return;
   const dx=ev.clientX-(r.left+tk.x*z),dy=ev.clientY-(r.top+tk.y*z);
   const s=currentAim(),max=spellRangeCells();
   s.angle=Math.atan2(dy,dx)*180/Math.PI;
   s.range=Math.max(.25,Math.min(max,Math.hypot(dx,dy)/z/settings.cellSize));
   updateAim();
   if(activeSpellMode==="area"&&areaKind==="attack")syncAreaAim();
   const d=slotDoc(),now=Date.now();
   const samePublished = d?.visible && ((activeSpellMode==="directed"&&spellType(d)==="directed") || (activeSpellMode==="area"&&spellType(d)==="area"&&d.kind==="attack"));
   if(samePublished&&now-lastWrite>100){
     lastWrite=now;
     setDoc(doc(db,"spells",spellDocId()),{angle:s.angle,range:s.range},{merge:true});
   }
 };
 const up=async()=>{
   h.removeEventListener("pointermove",move);h.removeEventListener("pointerup",up);
   const d=slotDoc(),s=currentAim();
   const samePublished=d?.visible&&((activeSpellMode==="directed"&&spellType(d)==="directed")||(activeSpellMode==="area"&&spellType(d)==="area"&&d.kind==="attack"));
   if(samePublished)await setDoc(doc(db,"spells",spellDocId()),{angle:s.angle,range:s.range},{merge:true});
 };
 h.addEventListener("pointermove",move);h.addEventListener("pointerup",up);
});

$("#publishSpell").onclick=async e=>{
 e.preventDefault();e.stopPropagation();if(!canEditSelectedSpell())return;
 const s=currentAim();
 const data={
   type:"directed",tokenId:selected,slot:activeSpellSlot,angle:s.angle,range:s.range,visible:true,
   ownerUid:auth.currentUser?.uid||"",imageUrl:"https://forgottenadventures.piwigo.com/_datas/w/s/l/wslrhsw6z4/i/uploads/w/s/l/wslrhsw6z4//2022/06/12/20220612092337-f8d252df-me.png"
 };
 await setDoc(doc(db,"spells",spellDocId()),data);
 spellData.set(spellDocId(),{id:spellDocId(),...data});
 renderSharedSpells();
 hideSpellEditors();
};
$("#publishArea").onclick=async e=>{
 e.preventDefault();e.stopPropagation();if(!canEditSelectedSpell())return;
 const area=areaCells();if(!area)return alert("У персонажа не указана площадь.");
 const data={type:"area",kind:areaKind,tokenId:selected,slot:activeSpellSlot,area,visible:true,ownerUid:auth.currentUser?.uid||"",areaImageUrl:areaKind==="attack"?"https://forgottenadventures.piwigo.com/uploads/w/s/l/wslrhsw6z4//2022/05/13/20220513143959-c33cdc5e.png":"https://forgottenadventures.piwigo.com/uploads/w/s/l/wslrhsw6z4//2021/06/23/20210623122729-ffa98e90.png"};
 if(areaKind==="attack"){const s=currentAim();data.angle=s.angle;data.range=s.range;}
 await setDoc(doc(db,"spells",spellDocId()),data);
 spellData.set(spellDocId(),{id:spellDocId(),...data});
 renderSharedSpells();
 hideSpellEditors();
};
async function deleteCurrentSpell(){
 if(!canEditSelectedSpell())return;
 await deleteDoc(doc(db,"spells",spellDocId())).catch(()=>null);
 aimState[activeSpellSlot]={angle:0,range:null};
 $("#areaAim").style.display="none";
 if(activeSpellMode==="directed")showDirectedEditor(false);
 else hideSpellEditors();
}
$("#deleteSpell").onclick=async e=>{e.preventDefault();e.stopPropagation();await deleteCurrentSpell()};
$("#deleteArea").onclick=async e=>{e.preventDefault();e.stopPropagation();await deleteCurrentSpell()};
$("#deleteAllSpells").onclick=async e=>{
 e.preventDefault();e.stopPropagation();if(!canEditSelectedSpell())return;
 await Promise.all([1,2].map(slot=>deleteDoc(doc(db,"spells",spellDocId(slot))).catch(()=>null)));
 aimState={1:{angle:0,range:null},2:{angle:0,range:null}};
 hideSpellEditors();renderSharedSpells();
};
async function deleteSpellsForToken(tokenId){
 await Promise.all([1,2].map(slot=>deleteDoc(doc(db,"spells",`${tokenId}_${slot}`)).catch(()=>null)));
}

$("#zoom").oninput=e=>{const z=e.target.value/100;$("#stage").style.transform=`scale(${z})`;$("#stage").style.marginRight=(settings.mapWidth*(z-1))+"px";$("#stage").style.marginBottom=(settings.mapHeight*(z-1))+"px";$("#zoomVal").textContent=e.target.value+"%"};

$("#masterLogin").onclick=()=>{$("#loginError").textContent="";$("#loginDlg").showModal()};
$("#loginForm").onsubmit=async e=>{
 e.preventDefault();
 $("#loginError").textContent="Входим…";
 const email=$("#email").value.trim(), password=$("#password").value;
 try{
   // Firebase заменит текущего anonymous-пользователя email/password-сессией.
   // Не вызываем signOut() заранее: так не создаются лишние anonymous users.
   const cred=await signInWithEmailAndPassword(auth,email,password);
   if(cred.user.uid!==MASTER_UID){
     await signOut(auth);
     $("#loginError").textContent="Этот аккаунт не является аккаунтом мастера.";
     await ensureAnonymous();
     return;
   }
   $("#loginError").textContent="";
   $("#loginDlg").close();
   renderCards();
 }catch(err){
   console.error("Master login failed:",err);
   const messages={
     "auth/invalid-credential":"Неверный email или пароль.",
     "auth/invalid-login-credentials":"Неверный email или пароль.",
     "auth/user-not-found":"Пользователь с таким email не найден.",
     "auth/wrong-password":"Неверный пароль.",
     "auth/invalid-email":"Некорректный email.",
     "auth/too-many-requests":"Слишком много попыток. Попробуй немного позже.",
     "auth/operation-not-allowed":"В Firebase не включён вход Email/Password.",
     "auth/unauthorized-domain":"Этот домен не добавлен в Firebase → Authentication → Authorized domains."
   };
   $("#loginError").textContent=messages[err.code]||("Ошибка Firebase: "+(err.code||err.message));
 }
};
$("#logout").onclick=async()=>{
 stopListeners();
 await signOut(auth);
 chars.clear(); tokenData.clear(); selected=null;
 renderCards(); renderTokens();
 await ensureAnonymous();
};
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest("dialog").close());

 const c=chars.get(id)||{};$("#charId").value=id;$("#cName").value=c.name||"";$("#cRole").value=c.role||"";$("#cAvatar").value=c.avatar||"";$("#cHp").value=c.hp??10;$("#cMaxHp").value=c.maxHp??10;$("#cBonus").value=c.bonus||"";$("#cSpeed").value=c.speed||"";$("#cSpellRange").value=c.spellRange||"";$("#cArea").value=c.area||"";$("#cNpc").checked=!!c.isNpc;$("#cNpcPng").value=c.npcPng||"";$("#cItems").value=c.items||"";$("#cBadges").value=c.badges||"";$("#deleteChar").style.display=id?"inline-block":"none";$("#charDlg").showModal()
}
$("#charForm").onsubmit=async e=>{e.preventDefault();if(!isMaster())return;let id=$("#charId").value||crypto.randomUUID();let existing=chars.get(id)||{};let c={name:$("#cName").value.trim(),role:$("#cRole").value.trim(),avatar:$("#cAvatar").value.trim(),hp:+$("#cHp").value,maxHp:+$("#cMaxHp").value,bonus:$("#cBonus").value.trim(),speed:+$("#cSpeed").value||0,spellRange:+$("#cSpellRange").value||0,area:+$("#cArea").value||0,isNpc:$("#cNpc").checked,npcPng:$("#cNpcPng").value.trim(),items:$("#cItems").value.trim(),badges:$("#cBadges").value.trim(),order:existing.order??chars.size};
 await setDoc(doc(db,"characters",id),c);
 if(!tokenData.has(id)){
   await setDoc(doc(db,"tokens",id),{x:100+Math.random()*200,y:100+Math.random()*150,npc:c.isNpc});
 }else{
   await setDoc(doc(db,"tokens",id),{npc:c.isNpc},{merge:true});
 }
 $("#charDlg").close()
};
$("#deleteChar").onclick=async()=>{const id=$("#charId").value;if(id&&confirm("Удалить персонажа и его фишку?")){await deleteSpellsForToken(id);await deleteDoc(doc(db,"tokens",id));await deleteDoc(doc(db,"characters",id));$("#charDlg").close()}};

$("#mapForm").onsubmit=async e=>{e.preventDefault();if(!isMaster())return;await setDoc(doc(db,"game","main"),{mapUrl:$("#mapUrl").value.trim(),mapWidth:+$("#mapWidth").value,mapHeight:+$("#mapHeight").value,cellSize:+$("#cellSize").value},{merge:true});$("#mapDlg").close()};

// Перемещение карты: зажать пустое место/саму карту и тянуть.
const viewport=$("#viewport");
let pan=null;
viewport.addEventListener("pointerdown",e=>{
  // Фишки, PNG-объекты и элементы управления имеют собственное перетаскивание.
  if(e.target.closest(".token,.overlay,button,input,label")) return;
  if(e.button!==0 && e.pointerType==="mouse") return;
  pan={x:e.clientX,y:e.clientY,left:viewport.scrollLeft,top:viewport.scrollTop,id:e.pointerId};
  viewport.setPointerCapture(e.pointerId);
  viewport.classList.add("panning");
  e.preventDefault();
});
viewport.addEventListener("pointermove",e=>{
  if(!pan||pan.id!==e.pointerId)return;
  viewport.scrollLeft=pan.left-(e.clientX-pan.x);
  viewport.scrollTop=pan.top-(e.clientY-pan.y);
});
function endPan(e){
  if(!pan||pan.id!==e.pointerId)return;
  pan=null;viewport.classList.remove("panning");
}
viewport.addEventListener("pointerup",endPan);
viewport.addEventListener("pointercancel",endPan);

applyMap();
</script>
